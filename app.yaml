command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8080"

resources:
  cpu: 2
  memory: 4Gi

env:
  - name: STREAMLIT_SERVER_ENABLE_CORS
    value: "false"
  - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
    value: "false"
  
  # Databricks SQL Warehouse for CDF Analytics
  - name: DATABRICKS_HOST
    value: "dbc-81d3c679-2bf9.cloud.databricks.com"  # Your workspace host
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/your-warehouse-id"  # SQL Warehouse HTTP path
  # DATABRICKS_TOKEN is automatically injected by Databricks Apps